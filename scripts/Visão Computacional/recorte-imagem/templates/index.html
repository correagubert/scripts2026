<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros Passos com o Flask</title>
</head>
<body>
    <h1>Recorte de Imagem</h1>
    <p>Se você está vendo esta página, o backend está funcionando corretamente!</p>

    <h2>Envie um formulário aqui:</h2>
    <form action="/enviar" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <button type="submit">Enviar</button>
    </form>

    <h2>Gostaria de enviar uma imagem?</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="imagem" accept="image/*" required>
        <button type="submit">Enviar Imagem</button>
    </form>

    <h2>Enviar imagem e coordenadas:</h2>
    <form action="/recortar" method="POST" enctype="multipart/form-data">
        <input type="file" id="imagem" name="imagem" accept="image/*" required><br><br>
        <label for="x">X:</label>
        <input type="number" id="x" name="x" required><br><br>
        <label for="y">Y:</label>
        <input type="number" id="y" name="y" required><br><br>
        <label for="w">W:</label>
        <input type="number" id="w" name="w" required><br><br>
        <label for="h">H:</label>
        <input type="number" id="h" name="h" required><br><br>
        <label for="nome_saida">Nome da Imagem:</label>
        <input type="text" id="nome_saida" name="nome_saida" required><br><br>
        <button type="submit">Recortar Imagem</button>
    </form>

    <h2>Finalizando...</h2>
    <form id="formRecorte">
        <div>
                <label for="imagem">Selecione a imagem:</label>
                <input type="file" id="imagem" name="imagem" accept="image/*" required><br><br>
    
                <label for="x">X:</label>
                <input type="number" id="x" name="x" required><br><br>
    
                <label for="y">Y:</label>
                <input type="number" id="y" name="y" required><br><br>
    
                <label for="w">W:</label>
                <input type="number" id="w" name="w" required><br><br>
    
                <label for="h">H:</label>
                <input type="number" id="h" name="h" required><br><br>
    
                <label for="nome_saida">Nome da Imagem:</label>
                <input type="text" id="nome_saida" name="nome_saida" required><br><br>
    
                <button type="submit">Recortar Imagem</button>
        </div>
    </form>

    <p id="resultado"></p>

    <script>
         const form = document.getElementById('formRecorte');
         const resultado = document.getElementById('resultado');

         form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formDados = new FormData(form);
            const res = await fetch('/recortar', {
                    method: 'POST',
                    body: formDados
                });
                const json = await res.json();
                if (res.ok) {
                    const data = await res.json();
                    resultado.textContent = `Imagem recortada salva como: ${data.nome_saida}`;
                } else {
                    resultado.textContent = 'Erro ao recortar a imagem.';
                }
            });
    </script>
</body>
</html>
